[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.1.0"
description = "Car catalog laboratory project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Михайло Горин" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["mypy>=1.10", "types-PyYAML>=6.0"]
report = ["Pillow>=10", "python-docx>=1.1"]

[project.scripts]
car-catalog = "car_catalog.main:main"
car-catalog-lab3 = "car_catalog.streaming.demo:run_demo"
car-catalog-lab3-benchmark = "car_catalog.streaming.benchmark:run_benchmark"
car-catalog-lab5 = "car_catalog.reliable.main:main"
car-catalog-lab5-benchmark = "car_catalog.reliable.benchmark:run_benchmark"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit", "tests/integration"]
addopts = ["-ra", "--strict-markers", "--cov=car_catalog", "--cov-branch", "--cov-report=term-missing", "--cov-report=html"]
markers = ["integration: exercises multiple components or real file boundaries"]

[tool.coverage.run]
branch = true
source = ["car_catalog"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = [
    "src/car_catalog/application.py",
    "src/car_catalog/criteria.py",
    "src/car_catalog/dto.py",
    "src/car_catalog/models.py",
    "src/car_catalog/oop_demo.py",
    "src/car_catalog/protocols.py",
    "src/car_catalog/repositories.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
car_catalog = ["py.typed"]
