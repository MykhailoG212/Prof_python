[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.1.0"
description = "Car catalog laboratory project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Михайло Горин" }]
dependencies = [
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.6,<3",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]
dev = ["mypy>=1.10", "types-PyYAML>=6.0"]
report = ["Pillow>=10", "python-docx>=1.1"]

[project.scripts]
car-catalog = "car_catalog.main:main"
car-catalog-lab3 = "car_catalog.streaming.demo:run_demo"
car-catalog-lab3-benchmark = "car_catalog.streaming.benchmark:run_benchmark"
car-catalog-lab5 = "car_catalog.reliable.main:main"
car-catalog-lab5-benchmark = "car_catalog.reliable.benchmark:run_benchmark"
car-catalog-lab7 = "car_catalog.persistence.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = ["-ra", "--strict-markers", "--cov=car_catalog", "--cov-branch", "--cov-report=term-missing", "--cov-report=html"]
markers = ["integration: exercises multiple components or real file boundaries"]

[tool.coverage.run]
branch = true
source = ["car_catalog"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = [
    "src/car_catalog/application.py",
    "src/car_catalog/criteria.py",
    "src/car_catalog/dto.py",
    "src/car_catalog/models.py",
    "src/car_catalog/oop_demo.py",
    "src/car_catalog/protocols.py",
    "src/car_catalog/repositories.py",
    "src/car_catalog/persistence/",
    "src/car_catalog/api.py",
    "src/car_catalog/dependencies.py",
    "src/car_catalog/external_api.py",
    "src/car_catalog/schemas.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
car_catalog = ["py.typed"]
