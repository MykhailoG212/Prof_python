[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "car-catalog"
version = "0.1.0"
description = "Car catalog laboratory project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Михайло Горин" }]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
car-catalog = "car_catalog.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
